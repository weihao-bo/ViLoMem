# Baseline Agent (no memory) — reference configuration.
#
# To evaluate another VLMEvalKit benchmark, copy this file and change the
# `dataset.benchmark` field (e.g. to "MathGlance", "WeMath", "MMMU_DEV_VAL").
# VLMEvalKit will auto-download the dataset on first run into DATASET_ROOT_DIR.

dataset:
  root_dir: "${DATASET_ROOT_DIR}"
  benchmark: "MathVista_MINI"
  split: null
  path: null
  start_index: 1
  limit: 0            # 0 = process all examples; set to N (e.g. 10) for smoke tests.
  task_filter: null
  force_reconvert: false

output:
  dir_prefix: "output/baseline_gpt-4.1"
  enable_tracing: false

model:
  name: "openai:gpt-4.1-mini"    # Any provider:model string resolvable by src/common/models/registry.py
  temperature: 0.7
  max_tokens: 10240

verification:
  enable: true

concurrent_execution:
  max_workers: 100
