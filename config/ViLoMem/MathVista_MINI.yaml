# Memory-enabled ViLoMem agent — reference configuration.
#
# Usage:
#   - Switch benchmark: copy this file and change `dataset.benchmark` (any
#     VLMEvalKit dataset supported by `src/common/verifiers/` or the
#     VLMEvalKit fallback pipeline).
#   - Reuse memories from prior runs: list the previous output directories
#     in `output.memory_list` below. Their `logic_memories.json` and
#     `visual_memories.json` are merged before evaluation starts.
#   - Text / image embedding endpoints: see the "Embedding Services"
#     section of README.md.

dataset:
  root_dir: "${DATASET_ROOT_DIR}"
  benchmark: "MathVista_MINI"
  split: null
  path: null
  start_index: 1
  limit: 0             # 0 = process all examples; set to N for smoke tests.
  task_filter: null
  force_reconvert: false

output:
  dir_prefix: "output/ViLoMem_gpt-4.1"
  enable_tracing: false
  memory_list: []      # e.g. ["output/ViLoMem_gpt-4.1/WeMath"] to seed memories from a prior run.

model:
  name: "openai:gpt-4.1-mini"     # Main solver (any provider:model resolved by src/common/models/registry.py).
  temperature: 0.7
  max_tokens: 8192
  system_prompt: |-
    Objective:
        Solve the given problem using a step by step process.

    Expected Output Structure:
    Step 1:
    Step 2:
    ...
    Step n: Final Answer: \boxed{answer}

    Question:

verification:
  enable: true

memory:
  generation_score_threshold: 0.7   # Generate new memories only when verification_score < threshold.

# ---------- Logic Memory (text-only guidelines distilled from logical errors) ----------
logic_memory:
  retrieval:
    enable: true
    limit: 3
    similarity_threshold: 0.7
  generation:
    enable: true
  store:
    file_path: "logic_memories.json"
    embedding_model: "local:qwen3-embedding"   # Any OpenAI-compatible /v1/embeddings endpoint.

analysis:                             # Problem-analysis node (subject + key-concept extraction).
  model: "openai:gpt-4.1-mini"
  temperature: 0.7
  max_tokens: 1024

logic_memory_generation:              # MLLM used to write new logic-memory entries on failure.
  model: "openai:gpt-4.1-mini"
  temperature: 0.7
  max_tokens: 2048

# ---------- Visual Memory (image + text guidelines for perceptual errors) ----------
visual_memory:
  retrieval:
    enable: true
    limit: 3
    similarity_threshold: 0.7
    enable_text_rerank: true
  generation:
    enable: true
  store:
    file_path: "visual_memories.json"
    embedding_model: "qwen:qwen2.5-vl-embedding"   # DashScope multimodal embedding.
    embedding_batch_size: 10
    embedding_top_n: 10
    text_embedding_model: "local:qwen3-embedding"

visual_memory_generation:
  model: "openai:gpt-4.1-mini"
  temperature: 0.7
  max_tokens: 2048

# ---------- Optional: Qwen2.5-VL attention heatmap (paper §Appendix) ----------
# Requires a local Qwen2.5-VL deployment (GPU). Disable if you only need the text pipeline.
heatmap_generation:
  enable: false
  debug: true
  include_question_in_heatmap: true
  qwen25vl:
    model: Qwen/Qwen2.5-VL-3B-Instruct
    general_prompt: Describe this image.
    attention_layer: 22
    devices:
      - cuda:0
    per_device_max_parallel: 5

concurrent_execution:
  max_workers: 100
