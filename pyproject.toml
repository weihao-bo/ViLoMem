[project]
name = "vilomem"
version = "0.1.0"
description = "Vision-Language Memory Agent for evaluating multimodal models on math and visual reasoning tasks"
authors = [
    { name = "Weihao Bo", email = "weihao.bo@example.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<4.0"
urls = { Homepage = "https://github.com/weihao-bo/ViLoMem", Repository = "https://github.com/weihao-bo/ViLoMem" }
dependencies = [
    # LangChain / LangGraph
    "langgraph>=1.0.0",
    "langchain>=1.2.0",
    "langchain-core>=1.2.0",
    "langchain-openai>=1.1.0",
    "langchain-dev-utils>=0.3.0",
    # Core runtime
    "python-dotenv>=1.0.1",
    "math-verify>=0.8.0",
    "dashscope>=1.24.9",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    # Vision / memory pipeline
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.44.0",
    "accelerate>=1.1.0",
    "qwen-vl-utils>=0.0.14",
    # Evaluation & dev tools
    "ms-vlmeval",
    "mypy>=1.11.1",
    "ruff>=0.6.1",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["common", "vl_agent", "vl_agent_baseline", "tools"]

[tool.setuptools.package-dir]
"common" = "src/common"
"vl_agent" = "src/vl_agent"
"vl_agent_baseline" = "src/vl_agent_baseline"
"tools" = "tools"

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "E501",
]

